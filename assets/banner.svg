<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.4)" />
    </linearGradient>

    <!-- Filters for Ambient Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="32" cy="0" r="1" fill="rgba(0, 229, 255, 0.15)" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }
  </style>

  <!-- Container Box with Rounded Corners and Outer Border -->
  <rect width="960" height="260" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="140" cy="50" r="100" fill="#00e5ff" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="820" cy="200" r="120" fill="#a855f7" opacity="0.12" filter="url(#glowViolet)" />

  <!-- Grid Overlay -->
  <rect width="960" height="260" rx="16" fill="url(#grid)" />

  <!-- Decorative Corner Accents -->
  <path d="M 24 16 L 16 16 L 16 24" fill="none" stroke="#00e5ff" stroke-width="2" />
  <path d="M 936 16 L 944 16 L 944 24" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 16 236 L 16 244 L 24 244" fill="none" stroke="#00e5ff" stroke-width="2" />
  <path d="M 944 236 L 944 244 L 936 244" fill="none" stroke="#ec4899" stroke-width="2" />

  <!-- Top Status Pill -->
  <g transform="translate(48, 32)">
    <rect width="360" height="28" rx="14" fill="url(#badgeGrad)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="pulse-dot" />
    <circle cx="16" cy="14" r="8" fill="#10b981" opacity="0.25" />
    <text x="30" y="18" fill="#e2e8f0" font-size="11.5" font-weight="600" letter-spacing="0.5" class="code-font">INGEGNERIA INFORMATICA • UNIBO</text>
  </g>

  <!-- Hero Main Name -->
  <text x="48" y="112" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" class="mono">
    Alessandro Mainardi
  </text>

  <!-- Role Subtitle -->
  <text x="48" y="148" fill="#f8fafc" font-size="19" font-weight="600" letter-spacing="0.2" class="mono">
    Software Developer <tspan fill="#64748b">•</tspan> Cloud Architecture &amp; Hybrid Homelab Systems
  </text>

  <!-- Academic Line -->
  <text x="48" y="174" fill="#94a3b8" font-size="14" font-weight="400" class="mono">
    Alma Mater Studiorum - Università di Bologna • Specializzazione Microsoft 365, Azure &amp; Zero-Trust
  </text>

  <!-- Tech Focus Chips Row -->
  <g transform="translate(48, 202)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="168" height="26" rx="6" fill="rgba(0, 229, 255, 0.08)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" />
    <text x="10" y="17" fill="#00e5ff" font-size="11.5" font-weight="600" class="code-font">☁️ M365 &amp; Entra ID</text>

    <!-- Chip 2 -->
    <rect x="178" y="0" width="186" height="26" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    <text x="188" y="17" fill="#c084fc" font-size="11.5" font-weight="600" class="code-font">🏛️ Homelab 24/7 (ReFS)</text>

    <!-- Chip 3 -->
    <rect x="374" y="0" width="168" height="26" rx="6" fill="rgba(236, 72, 153, 0.08)" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1" />
    <text x="384" y="17" fill="#f472b6" font-size="11.5" font-weight="600" class="code-font">⚡ Next.js &amp; TypeScript</text>

    <!-- Chip 4 -->
    <rect x="552" y="0" width="160" height="26" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
    <text x="562" y="17" fill="#34d399" font-size="11.5" font-weight="600" class="code-font">🛡️ Zero-Trust Security</text>
  </g>

  <!-- Right Side Visual Indicator Graphic -->
  <g transform="translate(850, 48)">
    <circle cx="36" cy="36" r="32" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-dasharray="4 4" stroke-width="1.5" />
    <circle cx="36" cy="36" r="22" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="36" cy="36" r="6" fill="#00e5ff" />
  </g>
</svg>
